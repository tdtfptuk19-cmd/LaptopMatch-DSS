services:
  - type: web
    name: laptopmatch-dss-api
    runtime: python
    buildCommand: "pip install -r laptopmatch_dss/requirements.txt && python -m laptopmatch_dss.data_subsystem.migrate"
    startCommand: "uvicorn laptopmatch_dss.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: API_HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: "*"
      - key: SCRAPER_RATE_LIMIT_SECONDS
        value: "2.0"
    healthCheckPath: /api/health
    autoDeploy: true
